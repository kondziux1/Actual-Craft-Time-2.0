ACT2-max-slider-value=Actual Craft Time Slider
ACT2-slider-sensitivity=Actual Craft Time Slider Sensitivity
ACT2-show-quality-chance=Show Quality Upgrade Chances
ACT2-belt-stack-mode=Calculate Belt Stacking

[mod-setting-description]
ACT2-Gui-Location=Choose where the GUI appears: as a draggable floating window on screen (recommended), or docked to the top/left edge.
ACT2-simple-text=Checked shows less words in the gui - checked is better
ACT2-dominant-show-inserters=Show or Hide inserters in ACT GUI - unchecked(false) overrides show/hide per recipe
ACT2-max-slider-value=Range: 25 to Infinity
ACT2-slider-sensitivity=Range: 1 to 10. Higher numbers may be better. This may not improve anything. Try using the mouse scroll wheel! :)
ACT2-show-quality-chance=Show quality upgrade chances and expected upgraded item rates when quality modules are installed in machines (like recyclers or assemblers).
ACT2-belt-stack-mode=Calculate transport belt saturation using researched belt stacking capacity (from Stack Inserter and Transport Belt Capacity research).

[string-mod-setting]
ACT2-Gui-Location-screen=Draggable window
ACT2-Gui-Location-left=Docked left
ACT2-Gui-Location-top=Docked top

[string-mod-setting-description]
ACT2-Gui-Location-screen=Freely movable floating window anywhere on screen. Remembers last moved position.
ACT2-Gui-Location-left=Fixed to the left edge of the screen.
ACT2-Gui-Location-top=Fixed to the top edge of the screen.

